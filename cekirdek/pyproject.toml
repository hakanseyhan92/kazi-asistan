[project]
name = "kazi-cekirdek"
version = "0.0.1"
description = "Kişisel veri kazıma asistanı — deterministik çekirdek"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "httpx",
    "playwright>=1.65.2",
    "selectolax>=1.0.2",
    "fast-flights>=3.1.0",
]

[project.scripts]
kazi-cekirdek = "kazi.__main__:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kazi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
